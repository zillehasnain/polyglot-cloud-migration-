name: HealthPulse CI

on:
  push:
    branches: [ "main", "feature/*" ]  # Runs on main and any feature branch
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup & Test .NET Backend
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore and Build Backend
        run: dotnet build backend-dotnet/*.csproj
      # Note: We skip 'dotnet test' for now unless you added the test project files

      # 2. Setup & Test Python Worker
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Python Dependencies
        run: |
          cd worker-python
          pip install requests pytest
      - name: Run Python Tests
        run: |
          cd worker-python
          pytest src/  # Runs any tests in your src folder

      # 3. Docker Build (To verify Milestone 1 in the Cloud)
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Images
        run: |
          docker build -t health-backend ./backend-dotnet
          docker build -t health-worker ./worker-python
          docker build -t health-frontend ./frontend-js
          docker build -t health-alerts ./alert-service