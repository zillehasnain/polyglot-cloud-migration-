name: HealthPulse CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup & Test .NET Backend
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build and Test Backend
        run: |
          dotnet build backend-dotnet/*.csproj
          # This runs any tests found in the backend folder
          dotnet test backend-dotnet/*.csproj

      # 2. Setup & Test Python Worker
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run Python Tests
        run: |
          cd worker-python
          pip install pytest requests
          pytest # This will now find your test_worker.py

      # 3. Verify Docker Builds (Crucial for Milestone 3 marks)
      - name: Build Docker Images
        run: |
          docker build -t health-backend ./backend-dotnet
          docker build -t health-worker ./worker-python
          docker build -t health-alerts ./alert-service
          docker build -t health-frontend ./frontend-js